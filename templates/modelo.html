<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbum - Contato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="{{url_for('static', filename='img/logo.png')}}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="d-flex flex-column">
  <header>
    <div class="header-container w-100 d-flex justify-content-center">
      <div class="logo-container w-50 d-flex justify-content-start">
        <img src="/static/img/verbumbook.png" class="w-25 m-4" alt="Verbum Logo">
      </div>
      <div class="d-flex align-items-center justify-content-end w-50 me-3">
        <div class="d-flex flex-column">
          {% if logado %}
          <div class="search-container">
            <input type="text" placeholder="Título, Autor, Palavra Chave...">
            <i class="bi bi-search"></i>
          </div>
          <div id="usuarioInterface">
            <div class="d-flex flex-column" id="botoesUsuario">
              <button class="w-100 border-0">Informações Pessoais</button>
              <button class="w-100">Reservas de livros</button>
              <a href="/logout"><button class="w-100">Sair</button></a>
            </div>
          </div>
          <div id="notificacoesInterface">
            <div class="d-flex flex-column" id="botoesNotificacoes">
              <div class="d-flex text-center p-2 align-items-end w-100">
                <img src="/static/img/notificacoesP.png" id="notificacoesImage" alt="Imagem de notificações">
                <div class="d-flex w-75 justify-content-center">
                  <h6 class="text-dark fs-5">SUAS NOTIFICAÇÕES</h6>
                </div>
              </div>
              <div id="botoesNotificacao">
                <button class="w-100 border-0">LIVRO DISPONÍVEL!</button>
                <button class="w-100">LIVRO DISPONÍVEL!</button>
                <a href="/logout"><button class="w-100">LIVRO DISPONÍVEL!</button></a>
              </div>
            </div>
          </div>
        </div>
        <div class="user-icon d-flex justify-content-center">
          <img src="/static/img/user.png" id="userImage" alt="Imagem do usuário" onclick="toggleUserMenu()">
        </div>
        <img src="/static/img/notificacoes.png" id="notificacoes" alt="Notificações" onclick="toggleNotifications()">
      </div>
    </div>
    <nav class="d-flex justify-content-start align-items-end h-100">
      <ul class="d-flex align-items-end" style="margin-bottom: 3px;">
        <li><a href="/home">Principal</a></li>
        <li><a href="/livros">Livros</a></li>
        <li><a href="/contato">Contato</a></li>
      </ul>
    </nav>
    {% endif %}
  </header>


  <main class="flex-fill py-5">
    {% block conteudo %}
    {% endblock %}
  </main>

  <footer class="d-flex justify-content-between align-items-center p-4" style="background-color: #333; color: white;">
    <!-- Logo -->
    <div class="logo-container">
      <img src="/static/img/logo.png" alt="Logo Verbum" style="width: 150px;">
    </div>

    <!-- Footer Columns -->
    <div class="d-flex justify-content-around w-75">
      <div class="column">
        <h3 style="font-size: 14px; font-weight: 700;">OUTROS</h3>
        <a href="#">Termos de serviço</a><br>
        <a href="#">Sobre</a>
      </div>

      <div class="column">
        <h3 style="font-size: 14px; font-weight: 700;">DESCOBRIR</h3>
        <a href="#">Início</a><br>
        <a href="#">Temas</a>
      </div>

      <div class="column">
        <h3 style="font-size: 14px; font-weight: 700;">AJUDA</h3>
        <a href="#" style="color: white; text-decoration: none;">Caixa de Entrada</a>
      </div>
    </div>

    <!-- Copyright -->
    <div class="copyright">
      SISTEMA DESENVOLVIDO PELOS ALUNOS: DAVI, MALU, IGOR, LUIZ HENRIQUE
    </div>
  </footer>


  <script src="/static/script.js"></script>
</body>

</html>
