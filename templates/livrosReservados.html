{% extends 'modelo.html' %}
{% block conteudo %}

<link rel="stylesheet" href="/static/livroR.css">

<div class="container mt-5">
    <div class="w-100">
      <div class="d-flex align-items-center">
        <img src="/static/img/bookicon.png" id="bookicon" class="me-3">
        <p class="fs-4 mt-2">Livros Reservados por {{nome_usuario}}</p>
      </div>
    </div>
  
    <div class="livros row row-cols-1 row-cols-md-4 g-4 mb-5 mt-3">
      {% if not livros %}
      <div class="w-100 d-flex justify-content-center h-100 align-items-center">
        <p>Não há livros!</p>
      </div>
      {% endif %}
      {% for livro in livros %}
      <div class="col">
        <a href="/livro/{{ livro.idLivro }}" class="text-break">
          <div class="book-card">
            <img src="/static/img/livros/{{ livro.imagemCapa }}" alt="Livro {{ livro.titulo }}" class="book-image" onerror="this.src = '/static/img/bookplaceholder.png'">
            <div class="book-footer">
              <p>{{ livro.titulo }}</p>
              <p>Data da reserva: {{ livro.dataReserva }}</p>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
    
  </div>

{% endblock %}
