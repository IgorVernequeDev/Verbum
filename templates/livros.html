{% extends 'modelo.html' %}

{% block conteudo %}

<div class="container mt-5">
  <div class="d-flex align-items-center w-100" style="width: 100%;">
    <div class="mb-5 d-flex align-items-center">
      <img src="/static/img/bookicon.png" id="bookicon" class="ms-3 ms-lg-0 me-3" style="width: 40px;">
      <p class="m-0">Livros</p>
    </div>
  </div>

  <div class="livros row row-cols-1 row-cols-md-4 g-4 mb-5">
    {% if not livros %}
    <div class="w-100 d-flex justify-content-center h-100 align-items-center">
      <p>Não há livros cadastrados!</p>
    </div>
    {% endif %}
    {% for livro in livros %}
    <div class="col">
      <a href="/livro/{{ livro.idLivro }}">
        <div class="book-card">
          {% if not imagemCapa %}
          <img src="/static/img/bookplaceholder.png">
          {% endif %}
          <img src="/static/img/livros/{{ livro.imagemCapa }}" alt="Livro {{ livro.titulo }}" class="book-image">
          <div class="book-footer">
            <p>{{ livro.titulo }} <br> {{ livro.autor }}</p>
          </div>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
