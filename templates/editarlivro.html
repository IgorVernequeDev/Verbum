{% extends 'modelo.html' %}
{% block conteudo %}

<form action="/editar/{{ livro.idLivro }}" method="POST" enctype="multipart/form-data">
  <div class="container" id="container">
    <div class="row ms-4">
      <div class="col-12 col-md-6 d-flex flex-column">

        <h2 class="titulos mb-2">Titulo</h2>
        <input type="text" id="titulo" name="titulo" placeholder="Insira o título..." value="{{ livro.titulo }}" maxlength="50"/>

        <h2 class="titulos mb-2">Descrição</h2>
        <textarea id="descricao" name="descricao" class="text-start ps-2 pt-2"
          placeholder="Insira um resumo do livro..." maxlength="1000">{{ livro.descricao }}</textarea>

        <h2 class="titulos mb-2">Autor</h2>
        <select class="mb-2" name="autor" id="autor" required>
          {% if not autores %}
            <option value="" disabled selected>Não há autores cadastrados!</option>
            <option value="novo">Cadastrar novo</option>
          {% else %}
            <option value="" disabled selected>Selecione um autor</option>
            {% for autor in autores %}
              <option value="{{ autor['idAutor'] }}" {% if autor['idAutor'] == livro['idAutor'] %}selected{% endif %}>{{ autor['nomeAutor'] }}</option>
            {% endfor %}
            <option value="novo">Cadastrar novo</option>
          {% endif %}
        </select>

        <div class="mb-2" id="novoAutor" style="display: none;">
          <input class="mt-2" type="text" name="novoAutor" placeholder="Nome do novo autor" maxlength="50">
          <button class="cadastra" type="button" id="cadastrarAutor">Cadastrar</button>
        </div>

        <h2 class="titulos mb-2">Editora</h2>
        <select name="editora" id="editora" required>
          {% if not editoras %}
            <option value="" disabled selected>Não há editoras cadastradas!</option>
            <option value="novo">Cadastrar novo</option>
          {% else %}
            <option value="" disabled selected>Selecione uma editora</option>
            {% for editora in editoras %}
              <option value="{{ editora['idEditora'] }}" {% if editora['idEditora'] == livro['idEditora'] %}selected{% endif %}>{{ editora['nomeEditora'] }}</option>
            {% endfor %}
            <option value="novo">Cadastrar novo</option>
          {% endif %}
        </select>

        <div class="mb-2" id="novaEditora" style="display: none;">
          <input class="mt-3" type="text" name="novaEditora" placeholder="Nome da nova editora" maxlength="50">
          <button type="button" class="cadastra" id="cadastrarEditora">Cadastrar</button>
        </div>

        <h2 class="titulos mb-2" style="margin-top: 6%;">Selecione a imagem da capa:</h2>
        <input class="selecionar form-control" accept="image/jpeg,image/png" type="file" name="imagemCapa" id="imagemCapa">
      </div>

      <div class="col-12 col-md-6 d-flex flex-column">

        <h2 class="titulos mb-2">Número de páginas</h2>
        <input type="number" id="numero_paginas" name="numero_paginas" placeholder="Insira o número de páginas..." value="{{ livro.numero_paginas }}" maxlength="10" required />

        <h2 class="titulos mb-2">Ano de publicação</h2>
        <input type="number" id="anoPublicacao" name="anoPublicacao" placeholder="Insira o ano de publicação" value="{{ livro.anoPublicacao }}" maxlength="4" required />

        <h2 class="titulos mb-2">Quantidade disponível</h2>
        <input type="number" id="quantidade" name="quantidade" placeholder="Insira a quantidade disponível" value="{{ livro.quantidade }}" maxlength="5" required />

        <h2 class="titulos mb-2">Gênero</h2>
        <select class="ls-custom-select col-md-8" id="genero" name="genero" required>
          <option value="Ação" {% if livro.genero == "Ação" %}selected{% endif %}>Ação</option>
          <option value="Romance" {% if livro.genero == "Romance" %}selected{% endif %}>Romance</option>
          <option value="Comédia" {% if livro.genero == "Comédia" %}selected{% endif %}>Comédia</option>
          <option value="Ficção Científica" {% if livro.genero == "Ficção Científica" %}selected{% endif %}>Ficção Científica</option>
          <option value="Fantasia" {% if livro.genero == "Fantasia" %}selected{% endif %}>Fantasia</option>
          <option value="Mistério" {% if livro.genero == "Mistério" %}selected{% endif %}>Mistério</option>
          <option value="Biografia" {% if livro.genero == "Biografia" %}selected{% endif %}>Biografia</option>
          <option value="História" {% if livro.genero == "História" %}selected{% endif %}>História</option>
          <option value="Autoajuda" {% if livro.genero == "Autoajuda" %}selected{% endif %}>Autoajuda</option>
          <option value="Suspense" {% if livro.genero == "Suspense" %}selected{% endif %}>Suspense</option>
          <option value="Terror" {% if livro.genero == "Terror" %}selected{% endif %}>Terror</option>
          <option value="Infantil" {% if livro.genero == "Infantil" %}selected{% endif %}>Infantil</option>
          <option value="Clássicos" {% if livro.genero == "Clássicos" %}selected{% endif %}>Clássicos</option>
          <option value="Poesia" {% if livro.genero == "Poesia" %}selected{% endif %}>Poesia</option>
          <option value="Drama" {% if livro.genero == "Drama" %}selected{% endif %}>Drama</option>
          <option value="Aventura" {% if livro.genero == "Aventura" %}selected{% endif %}>Aventura</option>
          <option value="Humor" {% if livro.genero == "Humor" %}selected{% endif %}>Humor</option>
          <option value="Esportes" {% if livro.genero == "Esportes" %}selected{% endif %}>Esportes</option>
          <option value="Religião" {% if livro.genero == "Religião" %}selected{% endif %}>Religião</option>
          <option value="Filosofia" {% if livro.genero == "Filosofia" %}selected{% endif %}>Filosofia</option>
        </select>

        <button class="Subir mt-4" type="submit">
          <img src="/static/img/baixar.png" alt="baixar" style="margin-right: 10px; height: 20px;">Atualizar Livro
        </button>
      </div>
    </div>
  </div>
</form>

<script>
  const autorSelect = document.getElementById('autor');
  const novoAutorDiv = document.getElementById('novoAutor');
  const cadastrarAutorButton = document.getElementById('cadastrarAutor');

  autorSelect.addEventListener('change', () => {
    if (autorSelect.value === 'novo') {
      novoAutorDiv.style.display = 'block';
    } else {
      novoAutorDiv.style.display = 'none';
    }
  });

  cadastrarAutorButton.addEventListener('click', () => {
    const novoNomeAutor = document.querySelector('#novoAutor input').value;

    fetch('/cadautor', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ nome: novoNomeAutor })
    })
    .then(async response => {
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }
      return response.json();
    })
    .then(data => {
      // Adiciona o novo autor na lista de opções
      const novaOpcao = document.createElement('option');
      novaOpcao.value = data.id;
      novaOpcao.text = novoNomeAutor;
      autorSelect.add(novaOpcao, 1);

      // Seleciona o novo autor automaticamente após cadastro
      autorSelect.value = data.id;

      novoAutorDiv.style.display = 'none';
      document.querySelector('#novoAutor input').value = '';
    })
    .catch(error => alert(`Erro ao cadastrar o autor: ${error.message}`));
  });

  const editoraSelect = document.getElementById('editora');
  const novaEditoraDiv = document.getElementById('novaEditora');
  const cadastrarEditoraButton = document.getElementById('cadastrarEditora');

  editoraSelect.addEventListener('change', () => {
    if (editoraSelect.value === 'novo') {
      novaEditoraDiv.style.display = 'block';
    } else {
      novaEditoraDiv.style.display = 'none';
    }
  });

  cadastrarEditoraButton.addEventListener('click', () => {
    const novoNomeEditora = document.querySelector('#novaEditora input').value;

    fetch('/cadeditora', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ nome_editora: novoNomeEditora })
    })
    .then(async response => {
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }
      return response.json();
    })
    .then(data => {
      // Adiciona a nova editora na lista de opções
      const novaOpcao = document.createElement('option');
      novaOpcao.value = data.id;
      novaOpcao.text = novoNomeEditora;
      editoraSelect.add(novaOpcao, 1);

      // Seleciona a nova editora automaticamente após cadastro
      editoraSelect.value = data.id;

      novaEditoraDiv.style.display = 'none';
      document.querySelector('#novaEditora input').value = '';
    })
    .catch(error => alert(`Erro ao cadastrar a editora: ${error.message}`));
  });

  function verificarSelecao() {
    const autor = document.getElementById('autor').value;
    const editora = document.getElementById('editora').value;
    if (autor === "novo" || editora === "novo") {
      alert("Por favor, cadastre o novo autor ou editora antes de enviar o formulário.");
      return false;
    } 
    return true;
  }
</script>

{% endblock %}
