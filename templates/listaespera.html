{% extends 'modelo.html' %}

{% block conteudo %}
<div class="container mt-5 mb-5" style="font-size: 20px;">  
    <div class="d-flex align-items-center">
        <i class="bi bi-card-checklist"></i>
        <p style="margin:10px;">Lista de Espera para o Livro {{ livro.titulo }}</p>
    </div>

    <div id="lista-espera">
        <h3>Lista de Espera</h3>
        <ul id="usuarios-espera">
        </ul>
    </div>
    
    <table class="table table-bordered">
        <thead>
            <tr style="background-color: #255EAF;">
                <th>Posição</th>
                <th>Nome</th>
                <th>Série</th>
                <th>Data da Reserva</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in lista_espera %}
            <tr>
                <td>{{ loop.index }}</td> <!-- Exibe a posição na lista -->
                <td>{{ usuario.nome }}</td>
                <td>{{ usuario.serie }}</td>
                <td>{{ usuario.dataReserva }}</td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>
</div>

{% endblock %}

<script>
    document.addEventListener('DOMContentLoaded', function() {
    async function carregarListaEspera(idLivro) {
        const response = await fetch(`/api/lista_espera/${idLivro}`);
        const listaEspera = await response.json();

        const ul = document.getElementById("usuarios-espera");
        ul.innerHTML = "";

        listaEspera.forEach(item => {
            const li = document.createElement("li");
            li.textContent = `Usuário: ${item.usuarioNome}, Posição: ${item.posicaoEspera}`;
            ul.appendChild(li);
        });
    }

    const idLivro = ...;
    const idUsuario = ...;

    carregarListaEspera(idLivro);
});

</script>
