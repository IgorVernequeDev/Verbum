{% extends 'modelo.html' %}

{% block conteudo %}

<div class="container mt-5">
  <div class="d-flex m-3">
    <img src="/static/img/bookicon.png" id="bookicon" class="me-3">
    <p>Livros</p>
  </div>
  <div class="livros row row-cols-1 row-cols-md-4 g-4">
    {% for livro in livros %}
    <div class="col">
      <a href="/livro/{{ livro.idLivro }}">
        <div class="book-card">
          <img src="/static/img/livros/{{ livro.imagemCapa }}" alt="Livro {{ livro.titulo }}" class="book-image">
          <div class="book-footer">
            <p>{{ livro.titulo }} <br> {{ livro.autor }}</p>
            <p class="stars">{{ livro.avaliacao }}★</p>
          </div>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
